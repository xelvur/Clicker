plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clicker'
    compileSdk 35

    defaultConfig {
        applicationId "com.clicker"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_static"
            }
        }

		ndk {
			abiFilters "arm64-v8a"
		}
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
		release {
			minifyEnabled true
			shrinkResources true
			proguardFilters getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
